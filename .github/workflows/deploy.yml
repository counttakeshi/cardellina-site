name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      # Served from https://<user>.github.io/cardellina-site/, so every link needs
      # that prefix. When the custom domain goes live, set the repo variable
      # USE_CUSTOM_DOMAIN to "true" and this drops to an empty base path.
      #
      # The test is inverted on purpose. An empty string is falsy in an Actions
      # expression, so with '' in the true slot the whole thing falls through to
      # the fallback and the base path never empties. Keep the non-empty value
      # in the true slot.
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.USE_CUSTOM_DOMAIN != 'true' && format('/{0}', github.event.repository.name) || '' }}

      # CNAME must only be published once DNS actually points at GitHub Pages,
      # otherwise Pages tries to serve the custom domain and the project URL 404s.
      #
      # www, not the apex: every one of the 29 indexed URLs from the old site is
      # on www.cardellina.com, and moving platform and canonical host in the same
      # step would be two migrations at once. Pages redirects the apex to www on
      # its own, so cardellina.com still works.
      - name: Add CNAME for the custom domain
        if: vars.USE_CUSTOM_DOMAIN == 'true'
        run: echo "www.cardellina.com" > build/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── IndexNow ───────────────────────────────────────────────────────────────
  # Tells Bing, Yandex, Seznam and Naver that pages changed, rather than waiting
  # to be crawled. One POST covers every URL; the protocol takes up to 10,000.
  #
  # Google does not participate, so this is not a substitute for anything. It is
  # free, and for a site this size the whole sitemap fits in a single request.
  #
  # Custom domain only. The key file has to be served from the same host as the
  # URLs being submitted, and the github.io staging copy is a different host on
  # a domain we do not own.
  notify-indexnow:
    needs: deploy
    if: vars.USE_CUSTOM_DOMAIN == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Submit the sitemap to IndexNow
        env:
          HOST: www.cardellina.com
          KEY: bb0647dfd071614f70788fb0ae02513c
        run: |
          set -euo pipefail

          # The live sitemap, not the local build: if the deploy did not land,
          # there is nothing new to announce and this should submit nothing.
          curl -sfS "https://$HOST/sitemap.xml" -o sitemap.xml

          # Up to 10,000 per request. This site has fewer than 40.
          jq -Rn             --arg host "$HOST"             --arg key "$KEY"             --argjson urls "$(grep -o '<loc>[^<]*</loc>' sitemap.xml               | sed 's|</\?loc>||g' | head -10000 | jq -Rsc 'split("\n") | map(select(length > 0))')"             '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}'             > payload.json

          echo "Submitting $(jq '.urlList | length' payload.json) URLs"

          # A non-2xx here must not fail the run: the deploy already succeeded,
          # and IndexNow is an optimisation. 200 and 202 are both success.
          code=$(curl -sS -o response.txt -w '%{http_code}'             -X POST https://api.indexnow.org/indexnow             -H 'Content-Type: application/json; charset=utf-8'             --data @payload.json)
          echo "IndexNow responded $code"
          cat response.txt || true
