<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}

<style>
:root{
  --paper:#E9E6DA; --paper2:#DDD9C9; --ink:#182019; --ink2:#5A6155;
  --rule:#B4B09D; --active:#B31166; --water:#2E6E8E;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
.sheet{position:relative;display:flex;flex-direction:column;height:100dvh;height:100vh;border:1px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--rule);
  padding:4px;padding-top:calc(4px + env(safe-area-inset-top))}

/* ---- collar (map-sheet marginalia) ---- */
.collar{padding:10px 12px 8px;border-bottom:1px solid var(--rule);flex:none}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.eyebrow b{color:var(--active);font-weight:600;letter-spacing:.14em}
h1#muniName{margin:4px 0 2px;font-size:clamp(1.35rem,6.4vw,2.1rem);line-height:1.02;
  font-weight:700;letter-spacing:.005em;text-transform:uppercase}
.claveRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.clave{border:1px solid var(--rule);padding:1px 5px;letter-spacing:.08em}
.edge{margin-top:6px;font-family:var(--mono);font-size:11.5px;line-height:1.45;color:var(--ink);
  border-left:2px solid var(--active);padding-left:8px;min-height:1.4em}
.edge span.dim{color:var(--ink2)}

/* ---- map ---- */
#map{flex:1 1 auto;min-height:0;background:var(--paper2);cursor:crosshair}
.leaflet-container{background:var(--paper2);font-family:var(--mono)}
.mlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#4A5147;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 2px var(--paper);
  white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;font-weight:600}
.mlabel.on{color:var(--active)}

/* ---- footer controls ---- */
.controls{flex:none;border-top:1px solid var(--rule);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.row{display:flex;gap:6px;align-items:center}
button.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;color:var(--ink);border:1px solid var(--rule);padding:8px 9px;cursor:pointer;
  flex:1 1 auto;min-height:38px;transition:background .12s,border-color .12s}
button.btn:hover{background:var(--paper2)}
button.btn:focus-visible{outline:2px solid var(--active);outline-offset:1px}
button.btn.live{border-color:var(--active);color:var(--active);background:rgba(179,17,102,.06)}
.readout{font-family:var(--mono);font-size:11.5px;color:var(--ink2);flex:1 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout b{color:var(--ink);font-weight:600}

/* ---- search panel ---- */
.panel{position:absolute;inset:auto 4px 112px;z-index:1200;background:var(--paper);border:1px solid var(--ink);
  padding:10px;display:none;max-height:70%;overflow:auto;box-shadow:0 -6px 24px rgba(24,32,25,.18)}
.panel.open{display:block}
.panel input{width:100%;font-family:var(--mono);font-size:15px;padding:9px 8px;border:1px solid var(--rule);
  background:var(--paper2);color:var(--ink)}
.panel input:focus{outline:2px solid var(--active);outline-offset:-1px}
.hits{list-style:none;margin:8px 0 0;padding:0}
.hits li{padding:9px 6px;border-bottom:1px solid var(--rule);cursor:pointer;display:flex;justify-content:space-between;gap:8px;
  font-size:14px}
.hits li:hover{background:var(--paper2)}
.hits li .mn{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.hint{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.06em;margin-top:8px;line-height:1.5}
.leaflet-control-attribution{font-family:var(--mono);font-size:9px;background:rgba(233,230,218,.82)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:760px){
  .sheet{padding:6px}
  .collar{padding:12px 16px 10px}
  .controls{flex-direction:row;align-items:center;padding:8px 14px}
  .row{flex:0 0 auto}
  button.btn{flex:0 0 auto}
  .panel{inset:auto 6px 60px auto;width:360px}
}
</style>

<div class="sheet">
  <header class="collar">
    <div class="eyebrow"><span>Carta municipal &middot; Chiapas</span><span id="srcTag">INEGI 2025 &middot; 124 mun.</span></div>
    <h1 id="muniName">Waiting for a fix</h1>
    <div class="claveRow">
      <span class="clave" id="clave">CVEGEO —</span>
      <span id="popTag"></span>
      <span id="modeTag">Tap the map to query any point</span>
    </div>
    <div class="edge" id="edgeInfo"><span class="dim">Boundary distance appears once a position is set.</span></div>
  </header>

  <div id="map"></div>

  <footer class="controls">
    <div class="row" style="flex:1 1 auto">
      <button class="btn" id="btnGps">Locate me</button>
      <button class="btn" id="btnSearch">Find</button>
      <button class="btn" id="btnBase">Base: paper</button>
    </div>
    <div class="row" style="flex:1 1 auto;min-width:0">
      <div class="readout" id="coords">No position</div>
      <button class="btn" id="btnCopy" style="flex:0 0 auto">Copy</button>
    </div>
  </footer>

  <div class="panel" id="panel">
    <input id="q" type="text" placeholder="Municipality name, or paste 16.7371, -92.6376" autocomplete="off" spellcheck="false">
    <ul class="hits" id="hits"></ul>
    <div class="hint">Paste coordinates in any order of lat/long with a comma. Tap a result to zoom to it.</div>
  </div>
</div>

</script>
<script>
/* ---------- topojson decode (minimal) ---------- */
function decodeTopo(t){
  const [sx,sy]=t.transform.scale,[tx,ty]=t.transform.translate;
  const arcs=t.arcs.map(a=>{let x=0,y=0;return a.map(d=>{x+=d[0];y+=d[1];return [x*sx+tx,y*sy+ty];});});
  const arcOf=i=> i<0 ? arcs[~i].slice().reverse() : arcs[i];
  const ring=idx=>{const p=[];idx.forEach((i,k)=>{const a=arcOf(i);for(let j=k?1:0;j<a.length;j++)p.push(a[j]);});return p;};
  const obj=t.objects[Object.keys(t.objects)[0]];
  return obj.geometries.map(g=>{
    const polys = g.type==='Polygon' ? [g.arcs] : g.arcs;
    const rings = polys.map(p=>p.map(ring));
    let m=[180,90,-180,-90];
    rings.forEach(p=>p[0].forEach(c=>{if(c[0]<m[0])m[0]=c[0];if(c[1]<m[1])m[1]=c[1];if(c[0]>m[2])m[2]=c[0];if(c[1]>m[3])m[3]=c[1];}));
    return {cvegeo:g.properties.cvegeo, name:g.properties.nom_agem, pob:+g.properties.pob||null, rings, bbox:m};
  });
}
const MUNIS = decodeTopo(TOPO);
const byId = Object.fromEntries(MUNIS.map(m=>[m.cvegeo,m]));

/* ---------- geometry helpers ---------- */
const R=Math.PI/180;
function inRing(pt,ring){
  let inside=false;const [x,y]=pt;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function inMuni(pt,m){
  if(pt[0]<m.bbox[0]||pt[0]>m.bbox[2]||pt[1]<m.bbox[1]||pt[1]>m.bbox[3]) return false;
  for(const poly of m.rings){
    if(inRing(pt,poly[0])){
      let hole=false;
      for(let h=1;h<poly.length;h++) if(inRing(pt,poly[h])){hole=true;break;}
      if(!hole) return true;
    }
  }
  return false;
}
function locate(pt){ for(const m of MUNIS) if(inMuni(pt,m)) return m; return null; }

/* local metric projection around a point */
function projector(lat0,lon0){
  const kx=111320*Math.cos(lat0*R), ky=110574;
  return {
    fwd:(lon,lat)=>[(lon-lon0)*kx,(lat-lat0)*ky],
    inv:(x,y)=>[lon0+x/kx, lat0+y/ky]
  };
}
/* nearest point on a municipality's boundary, in metres */
function nearestEdge(pt,m){
  const P=projector(pt[1],pt[0]); const [px,py]=[0,0];
  let best={d:Infinity,x:0,y:0};
  for(const poly of m.rings) for(const ring of poly){
    for(let i=1;i<ring.length;i++){
      const a=P.fwd(ring[i-1][0],ring[i-1][1]), b=P.fwd(ring[i][0],ring[i][1]);
      const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy;
      let t = L ? ((px-a[0])*dx+(py-a[1])*dy)/L : 0;
      t=Math.max(0,Math.min(1,t));
      const qx=a[0]+t*dx, qy=a[1]+t*dy;
      const d=Math.hypot(qx-px,qy-py);
      if(d<best.d) best={d,x:qx,y:qy};
    }
  }
  if(best.d===Infinity) return null;
  const bearing=(Math.atan2(best.x,best.y)/R+360)%360;
  const compass=['N','NE','E','SE','S','SW','W','NW'][Math.round(bearing/45)%8];
  /* step past the boundary to name what's on the other side */
  const len=Math.hypot(best.x,best.y)||1;
  let other=null;
  for(const over of [80,250,700,2000]){
    const p=P.inv(best.x*(1+over/len), best.y*(1+over/len));
    const o=locate(p);
    if(o && o.cvegeo!==m.cvegeo){ other=o.name; break; }
    if(!o) other='outside Chiapas';
  }
  return {d:best.d, compass, other, at:P.inv(best.x,best.y)};
}
function fmtDist(d){ return d<1000 ? Math.round(d/10)*10+' m' : (d/1000).toFixed(d<10000?1:0)+' km'; }

/* ---------- map ---------- */
const TINTS=['#DCE0C8','#D3DCCC','#E2DCC4','#D7DAD0','#DFD8CB'];
const map=L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true}).setView([16.5,-92.6],7.4);
L.control.zoom({position:'topright'}).addTo(map);
map.attributionControl.setPrefix('');

const bases={
  paper:null,
  streets:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,opacity:.55,
    attribution:'&copy; OpenStreetMap contributors'}),
  satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:18,opacity:.75,attribution:'Imagery &copy; Esri'})
};
let baseKey='paper';
const baseOrder=['paper','streets','satellite'];

const fc={type:'FeatureCollection',features:MUNIS.map((m,i)=>({type:'Feature',properties:{i},
  geometry:{type:'MultiPolygon',coordinates:m.rings}}))};
const layer=L.geoJSON(fc,{
  style:f=>({color:'#7E856F',weight:.8,fillColor:TINTS[f.properties.i%TINTS.length],fillOpacity:.85,opacity:.9}),
  interactive:false
}).addTo(map);
const layerOf={}; layer.eachLayer(l=>layerOf[l.feature.properties.i]=l);
map.fitBounds(layer.getBounds(),{padding:[6,6]});

const hi=L.geoJSON(null,{style:{color:'#B31166',weight:2.2,fillColor:'#B31166',fillOpacity:.14,opacity:1}}).addTo(map);
const edgeLine=L.polyline([],{color:'#B31166',weight:1.2,dashArray:'3 4',opacity:.9}).addTo(map);
const acc=L.circle([0,0],{radius:0,color:'#B31166',weight:1,fillColor:'#B31166',fillOpacity:.08,opacity:.5});
const dot=L.circleMarker([0,0],{radius:6,color:'#fff',weight:2.5,fillColor:'#B31166',fillOpacity:1});

/* labels */
const labels=L.layerGroup();
const labelMarkers=LABELPTS.map(p=>L.marker([p[2],p[1]],{interactive:false,keyboard:false,
  icon:L.divIcon({className:'',html:'<div class="mlabel" data-id="'+p[0]+'">'+p[3]+'</div>',iconSize:[0,0]})}));
labelMarkers.forEach(m=>labels.addLayer(m));
function syncLabels(){ if(map.getZoom()>=9){ if(!map.hasLayer(labels)) labels.addTo(map); } else if(map.hasLayer(labels)) map.removeLayer(labels); }
map.on('zoomend',syncLabels); syncLabels();
map.on('click',e=>setPoint([e.latlng.lng,e.latlng.lat],'pin'));

/* ---------- state + readout ---------- */
const $=id=>document.getElementById(id);
let current=null, mode='none';

function setPoint(pt,how,accuracy){
  mode=how;
  const m=locate(pt);
  current=m;
  $('coords').innerHTML='<b>'+pt[1].toFixed(5)+', '+pt[0].toFixed(5)+'</b>'+(accuracy?' &nbsp;±'+Math.round(accuracy)+' m':'');
  $('modeTag').textContent = how==='gps' ? 'Live GPS position' : 'Queried point';
  hi.clearLayers();
  document.querySelectorAll('.mlabel.on').forEach(el=>el.classList.remove('on'));

  if(!m){
    $('muniName').textContent='Outside Chiapas';
    $('clave').textContent='CVEGEO —'; $('popTag').textContent='';
    $('edgeInfo').innerHTML='<span class="dim">That point falls outside the state boundary.</span>';
    edgeLine.setLatLngs([]);
  } else {
    $('muniName').textContent=m.name;
    $('clave').textContent='CVEGEO '+m.cvegeo;
    $('popTag').textContent = m.pob ? m.pob.toLocaleString('en-US')+' hab.' : '';
    hi.addData({type:'Feature',geometry:{type:'MultiPolygon',coordinates:m.rings},properties:{}});
    const el=document.querySelector('.mlabel[data-id="'+m.cvegeo+'"]'); if(el) el.classList.add('on');
    const e=nearestEdge(pt,m);
    if(e){
      $('edgeInfo').innerHTML='<b>'+fmtDist(e.d)+'</b> from the boundary, '+e.compass+
        ' <span class="dim">&rarr;</span> '+(e.other||'adjacent municipality');
      edgeLine.setLatLngs([[pt[1],pt[0]],[e.at[1],e.at[0]]]);
    }
  }
  dot.setLatLng([pt[1],pt[0]]).addTo(map);
  if(accuracy){ acc.setLatLng([pt[1],pt[0]]).setRadius(accuracy).addTo(map); } else { map.removeLayer(acc); }
}

/* ---------- geolocation ---------- */
let watchId=null;
$('btnGps').onclick=()=>{
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null;
    $('btnGps').classList.remove('live'); $('btnGps').textContent='Locate me'; return; }
  if(!navigator.geolocation){ $('edgeInfo').innerHTML='<span class="dim">This browser has no location access. Paste coordinates under Find instead.</span>'; return; }
  $('btnGps').textContent='Fixing…';
  watchId=navigator.geolocation.watchPosition(p=>{
    $('btnGps').classList.add('live'); $('btnGps').textContent='GPS on';
    const pt=[p.coords.longitude,p.coords.latitude];
    setPoint(pt,'gps',p.coords.accuracy);
    if(map.getZoom()<10) map.setView([pt[1],pt[0]],11); else map.panTo([pt[1],pt[0]]);
  },err=>{
    $('btnGps').classList.remove('live'); $('btnGps').textContent='Locate me'; watchId=null;
    $('edgeInfo').innerHTML='<span class="dim">Location unavailable ('+err.message+'). Paste coordinates under Find instead.</span>';
  },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
};

/* ---------- basemap ---------- */
$('btnBase').onclick=()=>{
  if(bases[baseKey]) map.removeLayer(bases[baseKey]);
  baseKey=baseOrder[(baseOrder.indexOf(baseKey)+1)%baseOrder.length];
  if(bases[baseKey]) bases[baseKey].addTo(map).bringToBack();
  layer.setStyle(f=>({fillOpacity: baseKey==='paper'?.85:.25}));
  $('btnBase').textContent='Base: '+baseKey;
};

/* ---------- search ---------- */
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const INDEX=MUNIS.map(m=>({m,k:norm(m.name)})).sort((a,b)=>a.k<b.k?-1:1);
$('btnSearch').onclick=()=>{ const p=$('panel'); p.classList.toggle('open'); if(p.classList.contains('open')){$('q').focus();render('');} };
$('q').addEventListener('input',e=>render(e.target.value));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('panel').classList.remove('open'); });
function render(v){
  const ll=v.match(/(-?\d{1,3}\.\d+)[ ,]+(-?\d{1,3}\.\d+)/);
  const ul=$('hits'); ul.innerHTML='';
  if(ll){
    let a=+ll[1], b=+ll[2];
    let lat=Math.abs(a)<=20?a:b, lon=Math.abs(a)<=20?b:a;
    const li=document.createElement('li');
    li.innerHTML='<span>Go to '+lat.toFixed(5)+', '+lon.toFixed(5)+'</span><span class="mn">coords</span>';
    li.onclick=()=>{ setPoint([lon,lat],'pin'); map.setView([lat,lon],12); $('panel').classList.remove('open'); };
    ul.appendChild(li); return;
  }
  const q=norm(v.trim());
  INDEX.filter(x=>!q||x.k.includes(q)).slice(0,40).forEach(({m})=>{
    const li=document.createElement('li');
    li.innerHTML='<span>'+m.name+'</span><span class="mn">'+m.cvegeo+'</span>';
    li.onclick=()=>{
      const b=m.bbox; map.fitBounds([[b[1],b[0]],[b[3],b[2]]],{padding:[24,24]});
      hi.clearLayers(); hi.addData({type:'Feature',geometry:{type:'MultiPolygon',coordinates:m.rings},properties:{}});
      $('muniName').textContent=m.name; $('clave').textContent='CVEGEO '+m.cvegeo;
      $('popTag').textContent=m.pob?m.pob.toLocaleString('en-US')+' hab.':'';
      $('modeTag').textContent='Selected from list';
      $('edgeInfo').innerHTML='<span class="dim">Tap inside the municipality to measure boundary distance.</span>';
      $('panel').classList.remove('open');
    };
    ul.appendChild(li);
  });
}

/* ---------- copy ---------- */
$('btnCopy').onclick=async()=>{
  const t=$('coords').textContent.replace(/±.*/,'').trim();
  if(!t||t==='No position') return;
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');}catch(_){} ta.remove(); }
  $('btnCopy').textContent='Copied'; setTimeout(()=>$('btnCopy').textContent='Copy',1200);
};
$('srcTag').textContent='INEGI 2025 · '+MUNIS.length+' mun.';

/* ---------- offline copy ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js')
      .then(()=>navigator.serviceWorker.ready)
      .then(()=>{ $('srcTag').textContent='INEGI 2025 · '+MUNIS.length+' mun. · saved offline'; })
      .catch(()=>{});
  });
}
window.addEventListener('offline',()=>{
  if(baseKey!=='paper'){
    if(bases[baseKey]) map.removeLayer(bases[baseKey]);
    baseKey='paper'; layer.setStyle(()=>({fillOpacity:.85})); $('btnBase').textContent='Base: paper';
  }
});
